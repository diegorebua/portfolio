version: '3.8'

services:
  # Dev server com hot reload — porta 3000
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

  # Build de produção (Nginx) — use: docker compose --profile prod up
  frontend-prod:
    build: ./frontend
    ports:
      - "8080:80"
    profiles:
      - prod
