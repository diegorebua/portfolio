services:
  # Dev server com hot reload — acesso em localhost:3001
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      HMR_CLIENT_PORT: 3001
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"

  # Build de produção (Nginx) — use: docker compose --profile prod up
  frontend-prod:
    build: ./frontend
    ports:
      - "8080:80"
    profiles:
      - prod
